<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="/favicon.ico"/>
    <title>Chama Lele</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body>
    <div class="stage">
      <h1 class="title">CHAMADA</h1>
      <div class="card">
        <input id="input" type="text" placeholder="Nome"/>
        <div class="actions">
          <button id="btn-update" type="button" class="btn update">
            Atualizar
          </button>
          <button id="btn-add" type="button" class="btn add">
            Adicionar
          </button>
          <button id="btn-remove" type="button" class="btn remove">
            Remover
          </button>
        </div>
        <ul id="nomes"></ul>
      </div>
    </div>
  </body>
  <script type="module" src="index.mjs"></script>
</html>
